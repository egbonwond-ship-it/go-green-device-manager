# Checks the live site and its API (including the database connection). Run it from the Actions tab.
name: Live health check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE: https://icy-moss-046f5800f.5.azurestaticapps.net
    steps:
      - name: Home page
        run: curl -fsS -o /dev/null -w "home %{http_code}\n" "$SITE/"
      - name: API and database
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -sS "$SITE/api/health" || true)
            echo "$body"
            echo "$body" | grep -q '"status":"ok"' && exit 0
            sleep 20
          done
          exit 1
